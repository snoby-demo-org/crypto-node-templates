name: Smoke Test

# Builds the node image and boots it with a throwaway config to confirm the
# RPC endpoint comes up and the node reaches the expected sync state. Catches
# patch/rebranding breakage before the image is trusted in production.
#
# Requires the node's RPC user/password to be injected at run time. The runner
# only needs the container engine (docker); no external secrets are required if
# the config is generated from the repo's example file.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'patches/**'

jobs:
  smoke:
    runs-on: ${{ values.runnerLabel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: ./build.sh

      - name: Boot node + healthcheck
        run: |
          set -euo pipefail
          ID="smoke-${{ github.sha }}"
          docker run -d --name "$ID" -p ${{ values.rpcPort }}:${{ values.rpcPort }} \
            ${{ values.imageRepo }}:latest
          trap 'docker rm -f "$ID" >/dev/null 2>&1 || true' EXIT
          # Wait for RPC to come up, then healthcheck until synced or timeout.
          for i in $(seq 1 30); do
            docker inspect "$ID" --format '{{.State.Health.Status}}' 2>/dev/null | grep -q healthy && break
            sleep 10
          done
          STATUS="$(docker inspect "$ID" --format '{{.State.Health.Status}}' 2>/dev/null || echo empty)"
          test "$STATUS" = healthy || { echo "ERROR: node not healthy (status=$STATUS)"; docker logs "$ID" | tail -40; exit 1; }
          echo "Node healthy: $STATUS"
