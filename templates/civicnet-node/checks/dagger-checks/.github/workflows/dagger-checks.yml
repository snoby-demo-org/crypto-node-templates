name: Dagger Checks

# Runs lint + PII scan via the shared Dagger engine. The self-hosted runner
# image has the dagger CLI baked in and _EXPERIMENTAL_DAGGER_RUNNER_HOST points
# at the node-local always-on engine (see arc runner HelmRelease); cache is
# persistent across runs.
#
# Requires backup to a dagger module. By default this check snapshots every
# tracked file as a source; swap --source= for a module that lints your coin's
# actual source tree once vendored.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ${{ values.runnerLabel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (dagger)
        run: dagger call --mod github.com/snoby/dagger-checks lint --source=.

      - name: PII scan (dagger)
        run: dagger call --mod github.com/snoby/dagger-checks pii-scan --source=.
