# civicnetd configuration
# Generated from the CivicNet Node Backstage template.
# RPC authentication — set rpcpassword at deploy time (not committed).
rpcuser=${{ values.rpcUser }}
rpcpassword=CHANGE_ME
rpcport=${{ values.rpcPort }}
rpcallowip=127.0.0.1

# P2P
port=${{ values.p2pPort }}

# Connectivity
listen=1
server=1
daemon=1

# Networking: use this to force outbound connections to seed nodes as needed.
# addnode=<seed-node>:<p2pPort>
