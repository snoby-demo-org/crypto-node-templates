# CivicNet node — Docker Compose deployment
# Matches /data/civicnet conventions: bind-mount state + logs, ZMQ for pool feed.
services:
  civicnetd:
    # Build from local tree (see README/build.sh) or pull a prebuilt tag.
    build:
      context: .
      target: runtime
    image: ${{ values.imageRepo | default("iotapi322/civicnet") }}:${{ values.imageTag }}
    container_name: ${{ values.componentId }}
    restart: unless-stopped
    ports:
      - "${{ values.rpcPort }}:${{ values.rpcPort }}/tcp"    # RPC
      - "${{ values.p2pPort }}:${{ values.p2pPort }}/tcp"    # P2P
      - "28332:28332/tcp"  # ZMQ hashblock
      - "28333:28333/tcp"  # ZMQ hashtx
      - "28334:28334/tcp"  # ZMQ rawblock
      - "28335:28335/tcp"  # ZMQ rawtx
    volumes:
      - ./data/civicnet:/root/.civicnet
      - ./logs:/var/log/civicnet
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
