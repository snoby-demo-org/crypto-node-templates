---
# System entity: registers the system this CivicNet node belongs to. Register
# this in Backstage (alongside catalog-info.yaml) to make the catalog graph show
# the System node. Reference it from the component via spec.system.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{ values.system }}
  description: ${{ values.description }}
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: ${{ values.owner | default("group:default/guests") }}
  # domain: ${{ values.system }}-domain   # optional parent grouping
