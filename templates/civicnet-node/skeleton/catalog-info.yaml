---
# This file registers this component in Backstage. The whole file is a templated
# asset — fields are filled in when this repo is created from the CivicNet Node
# template.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.componentId }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.repoUrl | replace("github.com?owner=", "") | replace("&repo=", "/") }}
    backstage.io/techdocs-ref: dir:.
    # Optional, but makes the entity's ownership + lifecycle richer in the UI:
    # backstage.io/techdocs-entity: ${{ values.componentId }}
    # github.com/team-slug: my-org/my-team
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner | default("group:default/guests") }}
  system: ${{ values.system }}
  # Links the node to the shared CivicNet JSON-RPC API (registered in the
  # always-present crypto-node-templates location) + its data dependency.
  providesApis:
    - civicnet-node-rpc
  dependsOn:
    - resource:default/civicnet-node-data
