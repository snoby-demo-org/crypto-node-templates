name: Template CI (runs on k8s self-hosted runner)

on:
  push:
    paths:
      - 'templates/**'
      - 'catalog-info.yaml'
  pull_request:
    paths:
      - 'templates/**'
      - 'catalog-info.yaml'
  workflow_dispatch:

# That this workflow runs at all proves the ARC k8s-runner works:
#   - runs-on: k8s-runner  (the ARC scale set name / label in homelab-k3s)
#   - dind mode gives it a working docker daemon
jobs:
  validate:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate templates are well-formed YAML
        run: |
          set -e
          # ARC runner image is minimal (no python/ruby) — install a parser.
          (command -v python3 >/dev/null && pip install -q pyyaml) \
            || (command -v apt-get >/dev/null && sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip >/dev/null && pip install -q pyyaml) \
            || echo "WARN: no package manager for YAML parser"
          for f in $(find templates -name 'template.yaml') catalog-info.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$f')); print('OK: $f')" || { echo "ERROR: cannot parse $f"; exit 1; }
          done

      - name: Report runner environment
        run: |
          echo "hostname: $(hostname)"
          echo "running in kubernetes: $([ -d /var/run/secrets/kubernetes.io ] && echo yes || echo no)"
          echo "docker daemon: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable)"
