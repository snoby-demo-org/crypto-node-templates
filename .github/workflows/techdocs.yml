name: TechDocs Publish (System)

# Generates + publishes the CivicNet System TechDocs site to MinIO for Backstage.
# Runs on the templates repo's own k8s-runner (scoped to this repo).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install techdocs-cli + mkdocs
        run: |
          npm install -g @techdocs/cli
          pip install mkdocs-techdocs-core

      - name: Generate TechDocs
        run: techdocs-cli generate --no-docker --verbose

      - name: Publish TechDocs to MinIO (System entity)
        run: |
          techdocs-cli publish \
            --publisher-type awsS3 \
            --storage-name techdocs \
            --entity "default/system/civicnet-system" \
            --awsBucketRootPath ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TECH_DOCS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TECH_DOCS_SECRET_KEY }}
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: ${{ secrets.TECH_DOCS_S3_ENDPOINT }}
